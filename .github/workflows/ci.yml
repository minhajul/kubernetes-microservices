name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Inlined into the frontend's client bundle at build time. Set the
  # NEXT_PUBLIC_API_URL repository variable to override; the default matches
  # the Makefile.
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

jobs:
  auth-service:
    name: auth-service / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth-service
    steps:
      - uses: actions/checkout@v7

      # PHP 8.4 because composer.lock pins Symfony 8 (same as the Dockerfile).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, exif, gd, pcntl, pdo_mysql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/auth-service/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Feature tests go through the web middleware, which needs an APP_KEY.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # phpunit.xml points the suite at in-memory SQLite.
      - name: Run tests
        run: composer test

  frontend:
    name: frontend / lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build also type-checks the project.
      - name: Build
        run: npm run build

  images:
    name: image / ${{ matrix.service }}
    needs: [auth-service, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, frontend]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # Images pushed from main are multi-arch (amd64 + arm64 via QEMU) so they
      # also run on Apple Silicon clusters. Pull requests build amd64 only.
      - uses: docker/setup-qemu-action@v4
        if: env.PUSH == 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          # Only the frontend takes a build arg.
          build-args: ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', env.NEXT_PUBLIC_API_URL) || '' }}
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
