# Vault Secrets Operator: syncs secrets from Vault into the Kubernetes Secrets the apps
# read (see infrastructure/k8s/apps/security-vault-secrets.yaml).

# The VaultConnection every VaultAuth uses unless it names another one.
defaultVaultConnection:
  enabled: true
  address: http://vault.vault.svc.cluster.local:8200

controller:
  manager:
    # Synced Secrets hold only the values, without an extra _raw key with Vault's response.
    globalTransformationOptions:
      excludeRaw: true
  # Merged into the chart's non-root defaults to meet Pod Security "restricted".
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    capabilities:
      drop: ["ALL"]
