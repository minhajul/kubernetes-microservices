# Vault Secrets Operator: syncs secrets from Vault into the Kubernetes Secrets the apps
# read (see infrastructure/k8s/apps/security-vault-secrets.yaml).

# The VaultConnection every VaultAuth uses unless it names another one.
defaultVaultConnection:
  enabled: true
  address: http://vault.vault.svc.cluster.local:8200

controller:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
