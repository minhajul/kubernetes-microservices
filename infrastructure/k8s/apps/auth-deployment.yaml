apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  # No replicas here: the HPA in scaling-hpa.yaml owns the count (min 2, max 4).
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000              # Non-root user baked into the auth-service image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migration
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          env:
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "app_db"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "secret"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent  # <--- CRITICAL FOR LOCAL DEV
          env:
            - name: APP_KEY
              value: "base64:zmRo5jo2BqnWlVLnqbCy7XBq+sVEtIb6TigyzWmymuk="
            - name: APP_DEBUG
              value: "true"
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "app_db"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "secret"
            - name: LOG_CHANNEL
              value: "stderr"            # Send logs to FluentBit
          ports:
            - containerPort: 8000
          # /up is Laravel's built-in health route. It sits outside the web middleware,
          # so it needs no session or DB and fails only if the app itself is broken.
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5            # artisan serve is single-threaded; allow for a slow request
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: LoadBalancer
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
