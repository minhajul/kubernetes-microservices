apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  # No replicas here: the HPA in scaling-hpa.yaml owns the count (min 2, max 4).
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service  # Created by security-service-accounts.yaml
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000              # Non-root user baked into the auth-service image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migration
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          # On a fresh deploy MySQL refuses connections until its first-boot init finishes,
          # so wait for it (up to 5 minutes, like its startupProbe) instead of crash-looping.
          command:
            - sh
            - -c
            - |
              i=0
              until php -r 'new PDO("mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));' >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge 150 ]; then echo "MySQL at $DB_HOST:$DB_PORT is still not accepting connections"; exit 1; fi
                echo "Waiting for MySQL at $DB_HOST:$DB_PORT..."
                sleep 2
              done
              exec php artisan migrate --force
          env:
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "app_db"
            # The app's own MySQL user, which only has access to app_db (see mysql-deployment.yaml).
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-app-user
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-user
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent  # <--- CRITICAL FOR LOCAL DEV
          env:
            # Secrets are created by `make deploy-app-secrets`, never committed.
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-service-app
                  key: APP_KEY
            - name: APP_DEBUG
              value: "false"             # Debug error pages show env vars, including DB credentials
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "app_db"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-app-user
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-user
                  key: password
            - name: LOG_CHANNEL
              value: "stderr"            # Send logs to FluentBit
          ports:
            - containerPort: 8000
          # /up is Laravel's built-in health route. It sits outside the web middleware,
          # so it needs no session or DB and fails only if the app itself is broken.
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5            # artisan serve is single-threaded; allow for a slow request
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: LoadBalancer
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
