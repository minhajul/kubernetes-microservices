# One identity per app, with no API token mounted. None of the apps calls the
# Kubernetes API, so there are no Roles or RoleBindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  labels:
    app: auth-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql
  labels:
    app: mysql
automountServiceAccountToken: false
