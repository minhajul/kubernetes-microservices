# Vault Secrets Operator objects. They copy the app secrets from Vault (seeded by
# `make vault-setup`) into the Kubernetes Secrets the Deployments read, and re-check
# Vault every minute. Each app logs in to Vault with its own ServiceAccount, and its
# Vault role (see infrastructure/k8s/vault/setup.sh) can read only its own paths.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: auth-service
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: auth-service
    serviceAccount: auth-service
    audiences: ["vault"]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mysql
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mysql
    serviceAccount: mysql
    audiences: ["vault"]
---
# Laravel's APP_KEY. A new value in Vault restarts auth-service to pick it up.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: auth-service-app
spec:
  vaultAuthRef: auth-service
  type: kv-v2
  mount: secret
  path: auth-service/app
  refreshAfter: 60s
  destination:
    name: auth-service-app
    create: true
    overwrite: true          # Also takes over a Secret left by an older deploy
  rolloutRestartTargets:
    - kind: Deployment
      name: auth-service
---
# The app's MySQL user; auth-service restarts to pick up a change. MySQL itself only
# reads it on first init (see mysql-deployment.yaml).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mysql-app-user
spec:
  vaultAuthRef: mysql
  type: kv-v2
  mount: secret
  path: mysql/app-user
  refreshAfter: 60s
  destination:
    name: mysql-app-user
    create: true
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: auth-service
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mysql-root
spec:
  vaultAuthRef: mysql
  type: kv-v2
  mount: secret
  path: mysql/root
  refreshAfter: 60s
  destination:
    name: mysql-root
    create: true
    overwrite: true
