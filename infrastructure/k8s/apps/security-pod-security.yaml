# Pod Security Standards for the apps namespace.
# The app manifests set no namespace, so they land in the kubectl context's
# namespace, which is "default". Applying this adds the labels to the existing
# namespace; "kubectl delete -f" cannot remove it (default is protected).
#
# enforce=restricted: every pod must run as non-root, drop ALL capabilities,
#   disallow privilege escalation and use a seccomp profile. All three apps set
#   this in their securityContext (mysql pins runAsUser 999, the image's own
#   mysql user, so it never starts as root). Debug pods from a plain
#   "kubectl run" are rejected here: give them the same securityContext (see the
#   README's NetworkPolicy check) or run them in another namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
