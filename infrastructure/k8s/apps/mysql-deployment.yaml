apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
---
# MySQL's data directory, so the database survives pod restarts and redeploys.
# Uses the cluster's default StorageClass. `make clean` deletes it (and the data).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  strategy:
    type: Recreate          # Single instance: never run two mysqld on the same data dir
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      serviceAccountName: mysql  # Created by security-service-accounts.yaml
      automountServiceAccountToken: false
      # The official image starts as root only to chown its dirs and then drops to its
      # "mysql" user (999). The image already owns /var/lib/mysql and /var/run/mysqld as
      # 999 (mode 1777), so starting as 999 skips that root step. fsGroup makes the
      # mysql-data PVC mounted at /var/lib/mysql writable too.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.0
          # Secrets are created by `make deploy-app-secrets`, never committed. The image only
          # applies them when it initializes an empty data directory: it sets the root
          # password and creates the app user with full access to app_db only. Changing them
          # later needs ALTER USER, or a fresh mysql-data PVC.
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: password
            - name: MYSQL_DATABASE
              value: "app_db"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-app-user
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-user
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          # First boot initialises the data dir on a socket-only temporary server,
          # which can take minutes on a laptop. Ping over TCP so that phase doesn't count.
          # All probes run inside the container, so NetworkPolicies on 3306 can't affect them.
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30     # Up to 5 minutes
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
