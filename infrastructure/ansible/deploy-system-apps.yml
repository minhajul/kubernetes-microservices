- name: Configure EKS System Applications
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kube_config_path: "~/.kube/config"
    values_dir: "{{ playbook_dir }}/../k8s/observability"
    # Helm chart versions the values files were validated against.
    # Keep in sync with the *_VERSION variables in the Makefile.
    kube_prometheus_stack_version: "92.14.1"
    loki_version: "7.5.0"
    fluent_bit_version: "0.58.3"
    grafana_version: "10.5.15"
    metrics_server_version: "3.14.0"
    rustfs_version: "1.0.4"
    # RustFS root credentials, also used by Loki. Export both to set them. Otherwise an
    # existing Secret is kept, or random keys are generated the first time.
    rustfs_access_key: "{{ lookup('ansible.builtin.env', 'RUSTFS_ACCESS_KEY') }}"
    rustfs_secret_key: "{{ lookup('ansible.builtin.env', 'RUSTFS_SECRET_KEY') }}"

  tasks:
    # node-exporter and Fluent Bit need host access, so don't enforce baseline
    - name: Create Monitoring Namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: monitoring
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/warn: restricted
              pod-security.kubernetes.io/audit: restricted

    - name: Look up the metrics API registration
      kubernetes.core.k8s_info:
        api_version: apiregistration.k8s.io/v1
        kind: APIService
        name: v1beta1.metrics.k8s.io
      register: metrics_api

    # Some clusters already serve the metrics API (k3d, Rancher Desktop, minikube's
    # addon), and a second metrics-server would fight over the APIService. So install
    # it only when that API is missing or was installed by this same Helm release.
    - name: Deploy metrics-server (kubectl top and HPA metrics)
      when: >-
        metrics_api.resources | length == 0 or
        (metrics_api.resources[0].metadata.annotations | default({})).get('meta.helm.sh/release-name') == 'metrics-server'
      kubernetes.core.helm:
        name: metrics-server
        chart_ref: metrics-server
        chart_version: "{{ metrics_server_version }}"
        release_namespace: kube-system
        repo_url: https://kubernetes-sigs.github.io/metrics-server/
        values_files:
          - "{{ values_dir }}/metrics-server-values.yaml"

    - name: Check the RustFS credentials from the environment
      ansible.builtin.fail:
        msg: Set both RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY, or neither.
      when: (rustfs_access_key | length > 0) != (rustfs_secret_key | length > 0)

    - name: Look up the RustFS credentials Secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: rustfs-credentials
        namespace: monitoring
      register: rustfs_secret
      no_log: true

    - name: Create or update the RustFS credentials Secret
      when: rustfs_access_key | length > 0 or rustfs_secret.resources | length == 0
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: rustfs-credentials
            namespace: monitoring
          stringData:
            RUSTFS_ACCESS_KEY: "{{ rustfs_access_key or lookup('ansible.builtin.password', '/dev/null', chars=['digits', 'abcdef'], length=20) }}"
            RUSTFS_SECRET_KEY: "{{ rustfs_secret_key or lookup('ansible.builtin.password', '/dev/null', chars=['digits', 'abcdef'], length=40) }}"

    - name: Deploy kube-prometheus-stack (Prometheus, Alertmanager, kube-state-metrics, node-exporter)
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: kube-prometheus-stack
        chart_version: "{{ kube_prometheus_stack_version }}"
        release_namespace: monitoring
        repo_url: https://prometheus-community.github.io/helm-charts
        values_files:
          - "{{ values_dir }}/kube-prometheus-stack-values.yaml"

    # wait: Loki's bucket Job needs RustFS up
    - name: Deploy RustFS (Object Storage for Loki)
      kubernetes.core.helm:
        name: rustfs
        chart_ref: rustfs
        chart_version: "{{ rustfs_version }}"
        release_namespace: monitoring
        repo_url: https://charts.rustfs.com
        wait: true
        values_files:
          - "{{ values_dir }}/rustfs-values.yaml"

    # A pre-install hook Job creates Loki's buckets in RustFS before Loki starts
    - name: Deploy Loki (Log Storage)
      kubernetes.core.helm:
        name: loki
        chart_ref: loki
        chart_version: "{{ loki_version }}"
        release_namespace: monitoring
        repo_url: https://grafana.github.io/helm-charts
        values_files:
          - "{{ values_dir }}/loki-values.yaml"

    - name: Deploy Fluent Bit (Log Collector DaemonSet)
      kubernetes.core.helm:
        name: fluent-bit
        chart_ref: fluent-bit
        chart_version: "{{ fluent_bit_version }}"
        release_namespace: monitoring
        repo_url: https://fluent.github.io/helm-charts
        values_files:
          - "{{ values_dir }}/fluentbit-values.yaml"

    - name: Deploy Grafana (Visualizer)
      kubernetes.core.helm:
        name: grafana
        chart_ref: grafana
        chart_version: "{{ grafana_version }}"
        release_namespace: monitoring
        repo_url: https://grafana.github.io/helm-charts
        values_files:
          - "{{ values_dir }}/grafana-values.yaml"
